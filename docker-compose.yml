services:
  backend:
    build: ./backend
    container_name: task-manager-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:3000

  frontend:
    build: ./frontend
    container_name: task-manager-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend